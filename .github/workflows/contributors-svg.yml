name: Generate Contributors SVG

on:
  push:
    paths:
      - '.all-contributorsrc'

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'processing/p5.js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run contributors-svg generator
        run: node utils/contributors-svg.js

      - name: Reset all changes except contributors.svg
        run: |
          git restore --staged .
          git add contributors.svg
          git checkout -- .

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update contributors.svg from .all-contributorsrc"
          branch: update-contributors-svg
          title: "chore: update contributors.svg from .all-contributorsrc"
          body: "This PR updates the contributors.svg to reflect changes in .all-contributorsrc"
          add-paths: contributors.svg
          token: ${{ secrets.ACCESS_TOKEN }}
